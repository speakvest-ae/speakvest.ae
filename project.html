<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project | Speakvest.ae</title>
<meta name="description" content="Off-plan project details: price, payment plan, handover and checks.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Speakvest.ae">
<meta property="og:title" content="Project | Speakvest.ae">
<meta property="og:description" content="Off-plan project details: price, payment plan, handover and checks.">
<meta property="og:image" content="assets/img/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-wa="project">
<header id="site-header" class="site-header"></header>
<main>

<section class="page-hero" style="padding-bottom:20px"><div class="wrap" id="pd">
 <p class="note">Loading project…</p>
</div></section>
<section style="padding-top:20px"><div class="wrap grid g2" style="gap:40px;align-items:start">
 <div id="pd-body"></div>
 <div id="pd-form" data-lead-form="project" data-manual="1"></div>
</div></section>
<section class="tint"><div class="wrap"><div class="section-head"><div class="kicker">Plan the payments</div><h2>What will this project <span class="hl">cost you?</span></h2></div><div id="pd-tool"></div></div></section>
<section><div class="wrap"><div class="section-head"><div class="kicker">Before you pay</div><h2>Run the <span class="hl">10 checks.</span></h2></div><div data-tool="safety-check"></div></div></section>
<section class="white"><div class="wrap"><div class="section-head"><div class="kicker">More projects</div><h2>You might also like</h2></div><div class="grid g3" id="more"></div></div></section>

</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/js/site.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/tools.js"></script>
<script>
SV.ready.then(function(){ SV.projects().then(function(all){
  var slug=new URLSearchParams(location.search).get('p')||location.hash.slice(1), p=all.filter(function(x){return x.slug===slug})[0], E=SV.esc;
  if(!p){ document.getElementById('pd').innerHTML='<h1>Project not found</h1><p><a href="projects.html">Back to all projects</a></p>'; return; }
  document.title = p.name+' by '+p.developer+' | Speakvest.ae';
  var md=document.querySelector('meta[name=description]'); if(md) md.content=p.name+' in '+p.area+', '+p.emirate+' by '+p.developer+'. '+(p.priceFrom?'From '+SV.aed(p.priceFrom)+'. ':'')+'Payment plan, handover and checks.';
  var wa=SV.wa('project',{project:p.name,code:p.slug.toUpperCase()});
  var gal=[p.image].concat(p.gallery||[]);
  document.getElementById('pd').innerHTML='<div class="crumb"><a href="projects.html">Projects</a> / '+E(p.area)+'</div>'+
   '<span class="p-dev">'+E(p.developer)+'</span><h1 style="font-size:clamp(2.2rem,5vw,3.8rem)">'+E(p.name)+'</h1>'+
   '<p>📍 '+E(p.area)+', '+E(p.emirate)+' · '+E(p.types)+'</p>'+
   '<div class="gallery"><img src="'+E(gal[0])+'" alt="'+E(p.name)+'" width="1200" height="750" fetchpriority="high">'+(gal.length>1?'<div class="side">'+gal.slice(1,3).map(function(g){return '<img src="'+E(g)+'" alt="'+E(p.name)+' render" loading="lazy" width="600" height="375">'}).join('')+'</div>':'')+'</div>'+
   '<div class="facts" style="margin-top:20px"><div><span>Starting from</span><b>'+(p.priceFrom?SV.aed(p.priceFrom):'On request')+'</b></div><div><span>Payment plan</span><b>'+E(SV.planShort(p.paymentPlan))+'</b></div><div><span>Handover</span><b>'+E(p.handover||'TBC')+'</b></div><div><span>Golden Visa</span><b>'+(p.priceFrom>=2e6?'Eligible on value ✓':'From AED 2M units')+'</b></div></div>';
  document.getElementById('pd-body').innerHTML='<div class="kicker">About the project</div><p style="font-size:1.15rem">'+E(p.description||'Ask us for the full brochure, floor plans and availability.')+'</p>'+
   (p.units?'<h3>Homes</h3><p>'+E(p.units)+'</p>':'')+
   (p.paymentPlan?'<h3>Payment plan</h3><p>'+E(p.paymentPlan)+'</p>':'')+
   (p.amenities&&p.amenities.length?'<h3>Highlights</h3><div class="chips">'+p.amenities.map(function(a){return '<span>'+E(a)+'</span>'}).join('')+'</div>':'')+
   '<div class="btns" style="margin-top:24px"><a class="btn btn-wa" target="_blank" rel="noopener" href="'+wa+'">'+SV.WA_ICON+' Get the brochure on WhatsApp</a></div>'+
   '<p class="note" style="margin-top:18px">Prices, plans and availability come from developer materials and change often. We confirm the latest figures when you enquire.</p>';
  SV.leadForm(document.getElementById('pd-form'),{type:'project: '+p.name,title:'Get the price list & floor plans',sub:'For '+p.name+'. We reply on WhatsApp, usually within the hour.',project:p.name,button:'Send me the details'});
  var t=document.getElementById('pd-tool'); SV.renderTool(t,'payment-plan');
  if(p.priceFrom){ var r=t.querySelector('#pp-price'); r.value=Math.min(15000000,p.priceFrom); }
  var m=String(p.paymentPlan||'').match(/^(\d+)\/(\d+)/); if(m){ var a=+m[1], b=+m[2]; t.querySelector('#pp-down').value=Math.min(20,a); t.querySelector('#pp-build').value=a-Math.min(20,a); t.querySelector('#pp-hand').value=b; t.querySelector('#pp-post').value=0; }
  t.querySelector('.tool-body').dispatchEvent(new Event('input',{bubbles:true}));
  document.getElementById('more').innerHTML=all.filter(function(x){return x.slug!==p.slug && (x.emirate===p.emirate)}).slice(0,3).map(SV.projectCard).join('');
  var fl=document.querySelector('.wa-float'); if(fl) fl.href=wa;
});});
</script>
</body>
</html>
